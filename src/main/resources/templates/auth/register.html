<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Create Account - Cine VIP Pass</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="cinema-auth-body">

<div class="spotlight-beam"></div>
<div class="floating-cinema-icons">
    <span style="top: 15%; left: 8%; animation-delay: 0s;">🍿</span>
    <span style="top: 25%; right: 10%; animation-delay: 1.5s;">🎥</span>
    <span style="top: 65%; left: 12%; animation-delay: 3s;">🎟️</span>
    <span style="top: 75%; right: 15%; animation-delay: 4.5s;">🎬</span>
</div>

<div class="auth-container">
    <div class="cinema-ticket-card">
        <div class="ticket-top-banner">
            <span class="vip-badge"><i class="fas fa-star"></i> NEW MEMBER REWARD</span>
            <span class="popcorn-offer">🎁 Get 50% OFF Coupon</span>
        </div>

        <div class="ticket-card-header">
            <a href="/movies" class="brand-logo" style="font-size: 38px;">
                🎬 Cine
            </a>
            <h2>Join the Cine Club</h2>
            <p>Create your free account for instant ticket booking & 50% promo code</p>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form method="post" action="/register" th:object="${user}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            
            <div class="form-group" style="margin-bottom: 16px;">
                <label style="color: var(--text-muted); font-size: 13px;"><i class="fas fa-user"></i> Full Name</label>
                <input type="text" th:field="*{name}" placeholder="John Doe" required class="cinema-input"/>
            </div>

            <div class="form-group" style="margin-bottom: 16px;">
                <label style="color: var(--text-muted); font-size: 13px;"><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" th:field="*{email}" placeholder="name@example.com" required class="cinema-input"/>
            </div>

            <div class="form-group" style="margin-bottom: 22px;">
                <label style="color: var(--text-muted); font-size: 13px;"><i class="fas fa-lock"></i> Password</label>
                <div style="position: relative;">
                    <input type="password" id="regPassword" th:field="*{password}" placeholder="Minimum 6 characters" required minlength="6" class="cinema-input" style="padding-right: 42px;"/>
                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('regPassword', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-book-primary" style="width: 100%; font-size: 16.5px; padding: 14px; box-shadow: 0 0 20px rgba(229,9,20,0.5);">
                <i class="fas fa-user-plus"></i> Register & Get VIP Pass
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted);">
            Already have an account? <a href="/login" style="color: var(--primary); font-weight: 700; text-decoration: underline;">Sign In</a>
        </div>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
