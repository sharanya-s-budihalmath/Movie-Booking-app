<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>My Bookings - Cine</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>

<nav class="navbar">
    <div class="nav-brand"><a href="/movies"><span class="brand-logo">🎬 Cine</span></a></div>
    <div class="nav-links">
        <a href="/movies"><i class="fas fa-film"></i> Movies</a>
        <a href="/booking/my-bookings" class="active" sec:authorize="isAuthenticated()"><i class="fas fa-ticket-alt"></i> My Bookings</a>
        <a href="/admin" sec:authorize="hasRole('ADMIN')" class="admin-link"><i class="fas fa-user-shield"></i> Admin</a>
        <a href="/login" sec:authorize="!isAuthenticated()" class="btn-login">Login</a>
        <a href="/register" sec:authorize="!isAuthenticated()" class="btn-register">Register</a>
        <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" style="display:inline">
            <button type="submit" class="btn-logout">Logout</button>
        </form>
        <span sec:authorize="isAuthenticated()" class="welcome-msg">
            <i class="fas fa-user-circle"></i>
            <span sec:authentication="name"></span>
        </span>
    </div>
</nav>

<div class="container">
    <h2 style="font-size: 28px; margin-bottom: 24px;"><i class="fas fa-ticket-alt"></i> My Ticket History</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div th:if="${bookings.isEmpty()}" class="empty-state">
        <i class="fas fa-ticket-alt"></i>
        <h3>No booking records found</h3>
        <p style="color: var(--text-muted); margin-bottom: 20px;">Explore our catalog and book your favorite movie tickets now!</p>
        <a href="/movies" class="btn-book-primary" style="display: inline-flex; width: auto; padding: 12px 28px;">Browse Now Showing</a>
    </div>

    <div class="bookings-list" th:if="${!bookings.isEmpty()}">
        <div th:each="b : ${bookings}"
             th:class="'booking-summary-card ' + (${b.status == 'CANCELLED'} ? 'cancelled' : '')"
             style="display: grid; grid-template-columns: 110px 1fr auto; gap: 20px; align-items: center; margin-bottom: 20px;">
            <div>
                <img th:src="${b.show.movie.posterUrl}" th:alt="${b.show.movie.title}"
                     onerror="this.src='/images/placeholder.svg'"
                     style="width: 100%; height: 140px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border);"/>
            </div>
            <div>
                <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 6px;">
                    <span class="hero-badge-rating" th:text="${b.bookingReference}">Ref</span>
                    <span class="tag-pill" th:text="${b.show.hallName}">Hall</span>
                </div>
                <h3 th:text="${b.show.movie.title}" style="font-size: 22px; margin-bottom: 8px;">Movie Title</h3>

                <div class="detail-meta-list" style="margin-bottom: 6px; font-size: 13px;">
                    <span class="detail-meta-item"><i class="fas fa-calendar-alt"></i> <span th:text="${b.show.showDate}"></span></span>
                    <span class="detail-meta-item"><i class="fas fa-clock"></i> <span th:text="${#temporals.format(b.show.showTime, 'hh:mm a')}"></span></span>
                    <span class="detail-meta-item"><i class="fas fa-chair"></i> Seats: <b th:text="${b.seatsBooked}" style="color: var(--accent-cyan);"></b></span>
                </div>
                <div style="font-size: 16px; font-weight: 800; color: var(--accent-gold);">
                    Total: ₹<span th:text="${b.totalAmount}"></span>
                </div>
            </div>
            <div style="text-align: right; display: flex; flex-direction: column; gap: 12px; align-items: flex-end;">
                <span th:class="'hero-badge-rating ' + (${b.status == 'CANCELLED'} ? 'alert-error' : '')"
                      th:style="${b.status == 'CONFIRMED'} ? 'background: rgba(16, 185, 129, 0.15); color: #10b981; border-color: rgba(16, 185, 129, 0.3);' : ''"
                      th:text="${b.status}">CONFIRMED</span>

                <form th:if="${b.status == 'CONFIRMED'}" method="post"
                      th:action="@{/booking/cancel/{id}(id=${b.id})}"
                      onsubmit="return confirm('Are you sure you want to cancel this booking? Refund will be processed.')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn-logout" style="border-color: var(--primary); color: var(--primary);">
                        <i class="fas fa-times-circle"></i> Cancel Booking
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<footer class="footer"><p>🎬 Cine &copy; 2026 — Premium Movie Experience</p></footer>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
