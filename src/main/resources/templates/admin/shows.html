<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Manage Shows - Cine Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>

<nav class="navbar">
    <div class="nav-brand"><a href="/movies"><span class="brand-logo">🎬 Cine Admin</span></a></div>
    <div class="nav-links">
        <a href="/admin">Dashboard</a>
        <a href="/admin/movies">Movies</a>
        <a href="/admin/shows" class="active">Shows</a>
        <a href="/admin/users">Users</a>
        <a href="/admin/bookings">Bookings</a>
        <a href="/movies" class="btn-login"><i class="fas fa-external-link-alt"></i> View Site</a>
    </div>
</nav>

<div class="container">
    <h2 style="font-size: 28px; margin-bottom: 24px;">Manage Show Schedule</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <!-- ADD SHOW CARD -->
    <div class="booking-summary-card" style="margin-bottom: 30px;">
        <h3 style="font-size: 20px; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Add New Showtiming</h3>
        <form method="post" action="/admin/shows/save">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-row">
                <div class="form-group">
                    <label style="color: var(--text-muted); font-size: 13px;">Select Movie</label>
                    <select name="movieId" required style="background: var(--bg-card-solid); color: #fff; border-color: var(--border);">
                        <option value="">-- Select Movie --</option>
                        <option th:each="m : ${movies}" th:value="${m.id}" th:text="${m.title}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label style="color: var(--text-muted); font-size: 13px;">Hall Name</label>
                    <input type="text" name="hallName" placeholder="IMAX 3D, Screen 1..." required style="background: var(--bg-card-solid); color: #fff; border-color: var(--border);"/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label style="color: var(--text-muted); font-size: 13px;">Show Date</label>
                    <input type="date" name="showDate" required style="background: var(--bg-card-solid); color: #fff; border-color: var(--border);"/>
                </div>
                <div class="form-group">
                    <label style="color: var(--text-muted); font-size: 13px;">Show Time</label>
                    <input type="time" name="showTime" required style="background: var(--bg-card-solid); color: #fff; border-color: var(--border);"/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label style="color: var(--text-muted); font-size: 13px;">Total Seat Capacity</label>
                    <input type="number" name="totalSeats" min="1" value="30" required style="background: var(--bg-card-solid); color: #fff; border-color: var(--border);"/>
                </div>
                <div class="form-group">
                    <label style="color: var(--text-muted); font-size: 13px;">Ticket Price (₹)</label>
                    <input type="number" name="ticketPrice" step="0.01" min="1" value="250" required style="background: var(--bg-card-solid); color: #fff; border-color: var(--border);"/>
                </div>
            </div>
            <button type="submit" class="btn-book-primary" style="width: auto; padding: 12px 28px;">
                <i class="fas fa-plus-circle"></i> Add Showtime
            </button>
        </form>
    </div>

    <!-- SHOWS TABLE -->
    <h3 style="font-size: 22px; margin-bottom: 16px;">Scheduled Shows</h3>
    <div class="booking-summary-card" style="padding: 0; overflow: hidden;">
        <table class="admin-table">
            <thead>
                <tr><th>Movie</th><th>Hall</th><th>Date</th><th>Time</th><th>Available Seats</th><th>Price</th></tr>
            </thead>
            <tbody>
                <tr th:each="s : ${shows}">
                    <td th:text="${s.movie.title}"></td>
                    <td th:text="${s.hallName}"></td>
                    <td th:text="${s.showDate}"></td>
                    <td th:text="${#temporals.format(s.showTime, 'hh:mm a')}"></td>
                    <td th:text="${s.availableSeats} + ' / ' + ${s.totalSeats}"></td>
                    <td>₹<span th:text="${s.ticketPrice}"></span></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<footer class="footer"><p>🎬 CineBook Admin Control &copy; 2026</p></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
