<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Manage Movies - Cine Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>

<nav class="navbar">
    <div class="nav-brand"><a href="/movies"><span class="brand-logo">🎬 Cine Admin</span></a></div>
    <div class="nav-links">
        <a href="/admin">Dashboard</a>
        <a href="/admin/movies" class="active">Movies</a>
        <a href="/admin/shows">Shows</a>
        <a href="/admin/users">Users</a>
        <a href="/admin/bookings">Bookings</a>
        <a href="/movies" class="btn-login"><i class="fas fa-external-link-alt"></i> View Site</a>
    </div>
</nav>

<div class="container">
    <h2 style="font-size: 28px; margin-bottom: 24px;">Manage Movies Catalog</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <!-- ADD MOVIE CARD -->
    <div class="booking-summary-card" style="margin-bottom: 30px;">
        <h3 style="font-size: 20px; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Add New Movie</h3>
        <form method="post" action="/admin/movies/save" th:object="${movie}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-row">
                <div class="form-group">
                    <label style="color: var(--text-muted); font-size: 13px;">Title</label>
                    <input type="text" th:field="*{title}" required style="background: var(--bg-card-solid); color: #fff; border-color: var(--border);"/>
                </div>
                <div class="form-group">
                    <label style="color: var(--text-muted); font-size: 13px;">Genre</label>
                    <input type="text" th:field="*{genre}" placeholder="Sci-Fi, Action, Comedy..." required style="background: var(--bg-card-solid); color: #fff; border-color: var(--border);"/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label style="color: var(--text-muted); font-size: 13px;">Language</label>
                    <input type="text" th:field="*{language}" placeholder="English, Telugu, Hindi..." required style="background: var(--bg-card-solid); color: #fff; border-color: var(--border);"/>
                </div>
                <div class="form-group">
                    <label style="color: var(--text-muted); font-size: 13px;">Duration</label>
                    <input type="text" th:field="*{duration}" placeholder="2h 30m" required style="background: var(--bg-card-solid); color: #fff; border-color: var(--border);"/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label style="color: var(--text-muted); font-size: 13px;">Rating (0-10)</label>
                    <input type="number" step="0.1" min="0" max="10" th:field="*{rating}" required style="background: var(--bg-card-solid); color: #fff; border-color: var(--border);"/>
                </div>
                <div class="form-group">
                    <label style="color: var(--text-muted); font-size: 13px;">Release Year</label>
                    <input type="text" th:field="*{releaseDate}" placeholder="2026" style="background: var(--bg-card-solid); color: #fff; border-color: var(--border);"/>
                </div>
            </div>
            <div class="form-group">
                <label style="color: var(--text-muted); font-size: 13px;">Poster Image URL</label>
                <input type="text" th:field="*{posterUrl}" placeholder="https://..." style="background: var(--bg-card-solid); color: #fff; border-color: var(--border);"/>
            </div>
            <div class="form-group">
                <label style="color: var(--text-muted); font-size: 13px;">YouTube Trailer Embed URL</label>
                <input type="text" th:field="*{trailerUrl}" placeholder="https://www.youtube.com/embed/..." style="background: var(--bg-card-solid); color: #fff; border-color: var(--border);"/>
            </div>
            <div class="form-group">
                <label style="color: var(--text-muted); font-size: 13px;">Cast</label>
                <input type="text" th:field="*{cast}" placeholder="Actor A, Actor B..." style="background: var(--bg-card-solid); color: #fff; border-color: var(--border);"/>
            </div>
            <div class="form-group">
                <label style="color: var(--text-muted); font-size: 13px;">Description</label>
                <textarea th:field="*{description}" rows="3" required style="background: var(--bg-card-solid); color: #fff; border-color: var(--border);"></textarea>
            </div>
            <div style="display: flex; gap: 20px; margin-bottom: 16px;">
                <label style="color: #fff; font-size: 14px; cursor: pointer;">
                    <input type="checkbox" th:field="*{nowShowing}"/> Now Showing
                </label>
                <label style="color: #fff; font-size: 14px; cursor: pointer;">
                    <input type="checkbox" th:field="*{featured}"/> Featured Banner
                </label>
            </div>
            <button type="submit" class="btn-book-primary" style="width: auto; padding: 12px 28px;">
                <i class="fas fa-save"></i> Save Movie
            </button>
        </form>
    </div>

    <!-- MOVIES TABLE -->
    <h3 style="font-size: 22px; margin-bottom: 16px;">All Movies</h3>
    <div class="booking-summary-card" style="padding: 0; overflow: hidden;">
        <table class="admin-table">
            <thead>
                <tr><th>Title</th><th>Genre</th><th>Language</th><th>Rating</th><th>Status</th><th>Action</th></tr>
            </thead>
            <tbody>
                <tr th:each="m : ${movies}">
                    <td th:text="${m.title}"></td>
                    <td th:text="${m.genre}"></td>
                    <td th:text="${m.language}"></td>
                    <td>⭐ <span th:text="${m.rating}"></span></td>
                    <td>
                        <span class="hero-badge-rating"
                              th:style="${m.nowShowing} ? 'background: rgba(16, 185, 129, 0.15); color: #10b981; border-color: rgba(16, 185, 129, 0.3);' : ''"
                              th:text="${m.nowShowing} ? 'Showing' : 'Ended'"></span>
                    </td>
                    <td>
                        <form method="post" th:action="@{/admin/movies/delete/{id}(id=${m.id})}"
                              onsubmit="return confirm('Delete this movie?')" style="display:inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn-logout" style="border-color: var(--primary); color: var(--primary); padding: 4px 10px; font-size: 12px;">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<footer class="footer"><p>🎬 CineBook Admin Control &copy; 2026</p></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
