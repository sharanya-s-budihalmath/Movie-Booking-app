# ── Server ──
server.port=8080

# ── Database (H2 File DB for out-of-the-box zero-config execution) ──
spring.datasource.url=jdbc:h2:file:./data/cinebook_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Configuration (Uncomment to use MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/cinebook_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=your_password_here
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Thymeleaf ──
spring.thymeleaf.cache=false

# ── Email (Gmail SMTP) ──
# Replace with your Gmail and App Password if email notifications are desired
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password_here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Logging ──
logging.level.com.moviebooking=DEBUG
logging.level.org.springframework.security=INFO

